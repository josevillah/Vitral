<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vitral</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      /* Paleta Pergamino. Un vitral es vidrio de color separado por plomo, y aqui
         el plomo es la barra: clara, opaca, y con un hueco oscuro por donde se ve
         el proyecto abierto.

         LA VENTANA TIENE TRES SUPERFICIES Y LA POLARIDAD CAMBIA ENTRE ELLAS, asi
         que los tokens van agrupados por superficie y NO SE CRUZAN. Un color
         pensado para la barra clara no se lee sobre la rejilla oscura, y al reves;
         no falla nada, no avisa nada, simplemente no se lee.

         El caso concreto, que es el que se comete solo porque los nombres se
         parecen: `texto-tenue` y `error-barra` son de la barra y solo de la barra.
         Sobre la rejilla dan 3.07 y 2.49, por debajo del minimo de 4.5. Los
         estados vacios viven en la rejilla y usan `vacio-texto` y `error-rejilla`,
         que son tokens distintos. La version anterior de esto tenia un solo
         `--error` para los dos sitios, y por eso se partio en dos. */
      :root {
        /* --------- superficie 1 · la barra, #ece3c8 --------- */
        --barra-fondo: #ece3c8;
        --barra-borde: #c8bc98;
        --texto: #2e2b1c;
        --texto-tenue: #665f4a;
        --hover-fondo: #e2d8b8;
        --no-disponible: #a39c84;
        --error-barra: #a01c1c;

        /* --------- superficie 2 · la fila del proyecto activo, #231e12 ---------

           Es oscura a proposito, y el motivo no es de contraste: esta a 1.18 : 1
           de la rejilla, es practicamente el mismo material. El proyecto activo no
           queda resaltado, queda ABIERTO: su fila es un trozo del mismo negro que
           hay al otro lado, como si la barra tuviera un hueco.

           Y tiene la consecuencia practica que es la razon de que se eligiera: los
           dos acentos se quedan exactamente como estaban contratados. Sobre
           pergamino `#fde047` da 1.03 y seria invisible; sobre esta fila da 12.58.
           Aclarar esta fila rompe las dos cosas a la vez. */
        --activo-fondo: #231e12;
        --activo-texto: #fde047;
        --activo-marca: #bef264;
        /* La segunda linea de la fila activa. El contrato manda la ruta en
           `texto-tenue`, que es de la barra clara y aqui daria 1.35: es el hueco que
           dejo al subir la ruta del `title` a la fila. Se toma el valor de la
           maqueta, que da 4.08 sobre `activo-fondo`. */
        --activo-ruta: #8d7f4a;

        /* --------- superficie 3 · la rejilla, #0c0c0c --------- */
        --vacio-texto: #847c69;
        --error-rejilla: #ef4444;
        --boton-fondo: #241f13;
        --boton-borde: #4a4128;
        --boton-texto: #e0dac9;

        /* --------- superficie 4 · la franja de estado al pie, #332c1c ---------

           Se separa de la rejilla por COLOR Y POR CANTO a la vez, y las dos cosas
           son necesarias: la version anterior de la barra se apoyo solo en el canto
           y acabo a 1.01 : 1 de la rejilla, que es lo mismo que no existir. Quitar
           cualquiera de las dos repite aquel fallo.

           `pie-borde` es el mismo valor que `barra-borde`, a proposito: es el mismo
           canto dando la vuelta a la ventana. */
        --pie-fondo: #332c1c;
        --pie-borde: #c8bc98;
        --pie-valor: #e0dac9;
        --pie-etiqueta: #a39c84;

        /* --------- el icono de un proyecto ---------

           El cuadro es claro y la letra oscura, asi que el par funciona en las dos
           superficies en las que puede caer: sobre la barra clara el cuadro solo da
           1.48 y el peso lo lleva la letra, que da 7.51 sobre el cuadro; sobre la
           fila activa oscura el cuadro da 8.77 y destaca solo.

           Por eso NO LLEVA CANTO en la fila activa, y esta medido: con 8.77 ya se
           separa, y un borde ahi solo mete ruido donde ya hay separacion. La maqueta
           si lo lleva; manda el contrato. */
        --icono-fondo: #c8bc98;
        --icono-texto: #2e2b1c;

        /* --------- el indicador de actividad ---------

           `#fde047` NO se puede usar aqui, y esta medido: da 1.03 : 1 sobre la barra
           clara, o sea invisible. El ambar es ese mismo amarillo bajado hasta donde
           se ve sobre pergamino: 3.14 sobre la barra y 4.12 sobre la fila activa.
           El oliva da 3.86 y 3.36. */
        --ind-apagado: #b9ae90;
        --ind-oliva: #5c7a12;
        --ind-ambar: #9a7b16;

        --fuente-barra: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --fuente-mono: 'Cascadia Mono', Consolas, monospace;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0c0c;
      }

      /* La ventana es ahora dos franjas apiladas: el cuerpo, que se reparten la
         barra y la zona de rejillas, y la franja de estado, que va A TODO EL ANCHO
         y por debajo de las dos. Sin menus, sin botones de ventana, sin titulos. */
      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      /* `min-height: 0` para que el cuerpo ceda sus 28px al pie en vez de desbordar
         la ventana: sin el, un hijo de flex no encoge por debajo de su contenido y
         la franja se saldria por abajo. */
      #cuerpo {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }

      /* ---------------------------------------------------------------- barra */

      /* El divisor se queda aunque con 15.27 de separacion ya no haga falta para
         separar: da un canto limpio donde la superficie clara toca la oscura, y sin
         el el borde parece un corte. */
      #barra {
        display: flex;
        flex-direction: column;
        flex: 0 0 260px;
        width: 260px;
        box-sizing: border-box;
        overflow: hidden;
        background: var(--barra-fondo);
        border-right: 1px solid var(--barra-borde);
        color: var(--texto);
        font-family: var(--fuente-barra);
        font-size: 13px;
      }

      /* Plegada no se encoge con una transicion a proposito: cada fotograma
         intermedio avisaria al `ResizeObserver` y reajustaria todos los PTY. */
      #barra.plegada {
        flex-basis: 24px;
        width: 24px;
      }

      #barra.plegada #contenido {
        display: none;
      }

      #contenido {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }

      #cabecera {
        display: flex;
        flex: 0 0 32px;
        align-items: center;
        justify-content: space-between;
        height: 32px;
        padding: 0 8px 0 16px;
      }

      #titulo {
        color: var(--texto-tenue);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #lista {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
      }

      /* Alto de fila 44px -eran 32- y dos lineas, y el resto de medidas sale de la
         escala 4/8/12/16/24. De izquierda a derecha: la marca del activo en 0-3px,
         el icono en 16-38px, el nombre y la ruta ocupando el resto, y a la derecha
         el indicador de actividad con el contador de paneles a su derecha.

         El relleno izquierdo es 16 y el hueco 8, los dos de la escala: el icono cae
         en 16-38 como dice el contrato y el texto empieza en 46. La maqueta lo pone
         en 48 con un hueco de 10, que esta fuera de la escala; manda la escala. */
      .fila {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        height: 44px;
        padding: 0 8px 0 16px;
      }

      .fila:hover {
        background: var(--hover-fondo);
      }

      /* Un proyecto cuya ruta no resuelve no responde: ni hover ni cursor de mano. */
      .fila.no-disponible:hover {
        background: transparent;
      }

      /* El hueco por el que se ve el proyecto. Va DESPUES de `.fila:hover` y de
         `.fila.no-disponible:hover`, que tienen su misma especificidad: asi el
         activo gana y pasar el raton por encima no lo aclara. */
      .fila.activa,
      .fila.activa:hover {
        background: var(--activo-fondo);
      }

      /* La marca dice cual es el proyecto activo, no donde esta el foco: por eso
         solo aparece aqui y nunca en la rejilla. */
      .fila.activa::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--activo-marca);
      }

      /* El icono. Un cuadro de 22x22 con LA INICIAL EN MAYUSCULA SIEMPRE, aunque la
         carpeta se llame en minusculas: `vitral` da `V`. La mayuscula la pone el CSS
         con `text-transform`, no el JavaScript, para que no dependa de la
         localizacion del `toUpperCase`.

         Sale de la ruta y NUNCA del contenido del proyecto: deducirlo del lenguaje,
         del framework o del tipo de repositorio obligaria a mirar dentro, que es lo
         que no se hace por ningun camino. Un icono asi no entra ni disfrazado de
         mejora pequena.

         Dos proyectos con la misma inicial llevan el mismo icono, y se acepta: en
         una lista larga, unos cuadros con una letra y otros con dos se ven
         desiguales. Quien distingue ahi es el nombre y la ruta, que estan al lado. */
      .inicial {
        flex: 0 0 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 3px;
        background: var(--icono-fondo);
        color: var(--icono-texto);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        text-transform: uppercase;
        user-select: none;
      }

      /* Dos lineas: el nombre y, debajo, la RUTA COMPLETA, que hasta esta tanda
         vivia escondida en el `title` y ahora se ve siempre. El boton es el area de
         clic de las dos. */
      .nombre {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--texto);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      /* Un nombre que no cabe se corta por la derecha, que es lo normal. */
      .nombre-linea {
        line-height: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Y LA RUTA SE CORTA POR LA IZQUIERDA, que es donde esta lo generico: se
         prefiere perder `C:\Users\...` antes que el nombre de la carpeta.

         `direction: rtl` mueve el extremo de desbordamiento -y con el los puntos
         suspensivos- al lado izquierdo; `text-align: left` es lo que evita que una
         ruta corta, que cabe entera, se pegue al borde derecho. El texto en si sigue
         leyendose de izquierda a derecha porque `pintarLista` lo envuelve en un
         aislamiento LTR: sin el, una ruta acabada en `\` dejaria esa barra suelta al
         principio, que es la unica forma en que el algoritmo bidi muerde aqui. */
      .ruta-linea {
        direction: rtl;
        color: var(--texto-tenue);
        font-size: 11px;
        line-height: 14px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Sobre la fila activa `texto-tenue` daria 1.35 y la ruta no se leeria: es un
         token de la barra clara y la fila activa es superficie 2. El contrato no
         nombra ningun token para este caso -es el hueco que dejo- y se toma el valor
         de la maqueta, que ahi da 4.08 sobre `activo-fondo`. */
      .fila.activa .ruta-linea {
        color: var(--activo-ruta);
      }

      /* El indicador y el contador viven a la derecha, y el contador el ultimo. El
         hueco del indicador se reserva SIEMPRE aunque el indicador no este, que es
         lo que hace que el contador no baile de sitio cada vez que un proyecto
         arranca o para. Reservar el hueco no es dejar el indicador apagado: cuando un
         proyecto no ejecuta nada ahi no se dibuja nada. */
      .actividad {
        flex: 0 0 14px;
        width: 14px;
        height: 14px;
      }

      /* Cuatro cuadraditos de 6x6 con 2px de separacion, que suman 14x14. */
      .indicador {
        display: grid;
        grid-template-columns: 6px 6px;
        grid-template-rows: 6px 6px;
        gap: 2px;
      }

      /* `background-color` y no la abreviatura `background`: lo que se anima es solo
         el color, y animar una abreviatura con `var()` dentro es pedirle al motor mas
         de lo que hace falta. */
      .indicador i {
        border-radius: 1px;
        background-color: var(--ind-apagado);
      }

      /* EL COLOR VIAJA POR EL ANILLO: arriba-izquierda, arriba-derecha,
         abajo-derecha, abajo-izquierda, alternando oliva y ambar. Da sensacion de
         giro sin que nada gire.

         Y AQUI ESTA LA TRAMPA: una rejilla de 2x2 coloca a sus hijos en orden
         arriba-izq, arriba-der, ABAJO-IZQ, abajo-der, asi que el tercer hijo del DOM
         es la esquina de abajo a la izquierda y el cuarto la de abajo a la derecha.
         Como el anillo pasa por abajo-derecha ANTES que por abajo-izquierda, el
         retardo del CUARTO hijo (0.8s) va antes que el del TERCERO (1.2s). Si se
         escriben en orden 1-2-3-4 el color rebota en zigzag en vez de girar. */
      @keyframes enciende-oliva {
        0%,
        100% {
          background-color: var(--ind-apagado);
        }
        12%,
        22% {
          background-color: var(--ind-oliva);
        }
      }

      @keyframes enciende-ambar {
        0%,
        100% {
          background-color: var(--ind-apagado);
        }
        12%,
        22% {
          background-color: var(--ind-ambar);
        }
      }

      /* Ciclo completo 1.6s, un cuadrado encendido cada 0.4s. */
      .indicador i:nth-child(1) {
        animation: enciende-oliva 1.6s linear infinite;
        animation-delay: 0s;
      }

      .indicador i:nth-child(2) {
        animation: enciende-ambar 1.6s linear infinite;
        animation-delay: 0.4s;
      }

      /* abajo-derecha: cuarto hijo del DOM, tercero del anillo */
      .indicador i:nth-child(4) {
        animation: enciende-oliva 1.6s linear infinite;
        animation-delay: 0.8s;
      }

      /* abajo-izquierda: tercer hijo del DOM, cuarto del anillo */
      .indicador i:nth-child(3) {
        animation: enciende-ambar 1.6s linear infinite;
        animation-delay: 1.2s;
      }

      /* El numero de paneles VIVOS de ese proyecto, incluidos los ocultos. Aparece
         solo si es mayor que cero, y es la razon de esta tanda: hasta hoy podias
         dejar cuatro terminales corriendo en un proyecto, cambiar a otro, y no
         quedaba ni rastro. */
      .cuenta {
        flex: 0 0 auto;
        color: var(--texto-tenue);
        font-family: var(--fuente-mono);
        font-size: 11px;
        line-height: 1;
      }

      .cuenta:empty {
        display: none;
      }

      .fila.activa .cuenta {
        color: var(--activo-marca);
      }

      /* El mismo amarillo que el borde del panel enfocado, a proposito: `#fde047`
         es "lo que esta activo ahora", en los dos niveles. Si alguna vez hace falta
         oscurecer uno de los dos para que se lea, el que esta mal es el fondo. */
      .fila.activa .nombre {
        color: var(--activo-texto);
      }

      /* 2.14 : 1 a proposito: es el estado deshabilitado y tiene que verse
         apagado, no invisible. */
      .fila.no-disponible .nombre {
        color: var(--no-disponible);
        cursor: default;
      }

      /* La ruta se apaga con el nombre: dejarla en `texto-tenue` la haria mas
         legible que el nombre que tiene encima. */
      .fila.no-disponible .ruta-linea {
        color: var(--no-disponible);
      }

      .icono {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--texto-tenue);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

      .icono:hover {
        background: var(--hover-fondo);
        color: var(--texto);
      }

      /* La `x` de quitar, cuando su fila es la activa, cae sobre la superficie 2 y
         no sobre la barra: `texto-tenue` ahi daria 1.35 y no se veria. Se le da el
         unico color de texto que esa superficie tiene contratado, y se le quita el
         fondo de hover, que es un token de la barra clara y encenderia un cuadro
         claro dentro del hueco oscuro. */
      .fila.activa .icono {
        color: var(--activo-texto);
      }

      .fila.activa .icono:hover {
        background: transparent;
        color: var(--activo-texto);
      }

      /* Con `opacity` y no con `visibility`, que quitaria el boton del recorrido
         del tabulador. Sigue ocupando su sitio siempre, que es lo que evita que la
         fila entera se recoloque al pasar el raton por encima.

         El contrato no lo nombra al repartir el ancho de la fila -ni la maqueta lo
         dibuja-, asi que se queda donde ya estaba: el ultimo por la derecha, con el
         contador a su izquierda. Quitarlo dejaria la lista sin forma de olvidar un
         proyecto. */
      .quitar {
        opacity: 0;
      }

      .fila:hover .quitar,
      .quitar:focus {
        opacity: 1;
      }

      /* El mensaje de error va debajo de la lista, nunca dentro de una fila. Y en
         `error-barra`, que es de la barra: sobre la rejilla daria 2.49. */
      #error {
        flex: 0 0 auto;
        margin: 0;
        padding: 8px 16px;
        color: var(--error-barra);
      }

      #error:empty {
        display: none;
      }

      /* -------------------------------------------------------------- rejilla */

      #zona {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        background: #0c0c0c;
      }

      /* Cada proyecto tiene su propia rejilla. Al cambiar de activo la del
         anterior se oculta con sus paneles VIVOS: sus PTY siguen corriendo.
         La clase `paneles-N` la pone la rejilla; el CSS es quien la interpreta. */
      .rejilla {
        display: grid;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        gap: 2px;
        background: #0c0c0c;
      }

      .rejilla.oculta {
        display: none;
      }

      .rejilla.paneles-1 {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }

      .rejilla.paneles-2 {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
      }

      .rejilla.paneles-3,
      .rejilla.paneles-4 {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }

      /* Con un numero impar el ultimo se estira y ocupa el hueco: no existe la
         celda vacia, asi que no hay que dibujarla ni decidir que hace al pulsarla. */
      .rejilla.paneles-3 .celda:last-child {
        grid-column: 1 / span 2;
      }

      /* El borde esta siempre y solo cambia de color. Si apareciera y desapareciera,
         cada cambio de foco moveria dos pixeles todas las celdas y dispararia el
         reajuste de todos los PTY sin ninguna razon. */
      .celda {
        position: relative;
        box-sizing: border-box;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 2px solid #2a2a2a;
        background: #0c0c0c;
      }

      /* El mismo `#fde047` que el nombre del proyecto activo: no hay dos amarillos. */
      .celda.enfocada {
        border-color: var(--activo-texto);
      }

      /* Los estados vacios son cinco situaciones distintas y cada una tiene su
         texto: caer de una en otra en silencio esconde que algo se rompio.
         Viven sobre la rejilla, asi que llevan los tokens de la superficie 3 y
         NINGUNO de la barra. `pointer-events: none` para no comerse los clics de
         la rejilla; el boton lo recupera para si. */
      #vacio {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        gap: 16px;
        padding: 24px;
        pointer-events: none;
        font-family: var(--fuente-barra);
        text-align: center;
      }

      #vacio[hidden] {
        display: none;
      }

      #vacio-texto {
        margin: 0;
        color: var(--vacio-texto);
        font-size: 14px;
      }

      #vacio-texto.error {
        color: var(--error-rejilla);
      }

      /* NEUTRO, y no es un descuido: la paleta no tiene color de accion porque los
         dos acentos ya significan otra cosa. Un boton amarillo diria que el boton
         esta activo, que es falso.

         Sin estado hover propio declarado, tambien a proposito: es el unico control
         de la aplicacion y no compite con nada. Si al probarlo se ve muerto, se
         anade entonces y se escribe antes en el contrato. */
      #vacio-boton {
        padding: 12px 24px;
        border: 1px solid var(--boton-borde);
        border-radius: 4px;
        background: var(--boton-fondo);
        color: var(--boton-texto);
        font-family: var(--fuente-barra);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
      }

      #vacio-boton[hidden] {
        display: none;
      }

      /* ---------------------------------------------------- franja de estado */

      /* Superficie 4, a todo el ancho de la ventana y por debajo de la barra y de la
         rejilla. CPU y memoria DE LA MAQUINA ENTERA, no por panel: atribuir procesos
         a un panel miente por debajo en cuanto uno se desprende del arbol, y lo que
         se quiere saber es que se esta comiendo la maquina.

         SE SEPARA POR COLOR Y POR CANTO A LA VEZ, y las dos cosas hacen falta. La
         version anterior de la barra se apoyo solo en el canto y acabo a 1.01 : 1 de
         la rejilla: no era poco contraste, era la misma superficie. Aqui no se
         repite, asi que ni el fondo ni el `border-top` sobran. */
      #pie {
        display: flex;
        flex: 0 0 28px;
        align-items: center;
        box-sizing: border-box;
        gap: 18px;
        height: 28px;
        padding: 0 14px;
        background: var(--pie-fondo);
        border-top: 1px solid var(--pie-borde);
        color: var(--pie-valor);
        font-family: var(--fuente-mono);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
      }

      /* La etiqueta va en `pie-etiqueta` y la cifra en `pie-valor`: se leen como una
         sola linea porque el rotulo pesa menos que el numero. */
      #pie i {
        color: var(--pie-etiqueta);
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="cuerpo">
        <aside id="barra">
          <div id="contenido">
            <div id="cabecera">
              <span id="titulo">Proyectos</span>
              <button id="anadir" class="icono" type="button" title="Anadir un proyecto">+</button>
            </div>
            <ul id="lista"></ul>
            <p id="error"></p>
          </div>
        </aside>
        <main id="zona">
          <!-- El boton va debajo del texto y separado 16px, y solo aparece en tres de
               los cinco estados vacios: quien decide cual es `pintarVacio`, en
               panel.js, que es tambien quien sabe que hace al pulsarlo. -->
          <div id="vacio" hidden>
            <p id="vacio-texto"></p>
            <button id="vacio-boton" type="button" hidden></button>
          </div>
        </main>
      </div>
      <!-- La franja de estado. Arranca con guiones y no con ceros: si los contadores
           de rendimiento no se pueden abrir, `maquina:uso` no se emite nunca y un
           `0%` seria una cifra falsa en vez de un hueco honrado. -->
      <footer id="pie">
        <span><i>CPU</i> <span id="pie-cpu">—</span></span>
        <span><i>RAM</i> <span id="pie-ram">—</span></span>
      </footer>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>

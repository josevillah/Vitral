<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vitral</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0c0c;
      }

      /* La rejilla ocupa la ventana entera: ni barras, ni menus, ni titulos. La
         clase `paneles-N` la pone la cuadricula; el CSS es quien la interpreta. */
      #cuadricula {
        display: grid;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        gap: 2px;
        background: #0c0c0c;
      }

      #cuadricula.paneles-1 {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }

      #cuadricula.paneles-2 {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
      }

      #cuadricula.paneles-3,
      #cuadricula.paneles-4 {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }

      /* Con un numero impar el ultimo se estira y ocupa el hueco: no existe la
         celda vacia, asi que no hay que dibujarla ni decidir que hace al pulsarla. */
      #cuadricula.paneles-3 .celda:last-child {
        grid-column: 1 / span 2;
      }

      /* El borde esta siempre y solo cambia de color. Si apareciera y desapareciera,
         cada cambio de foco moveria dos pixeles todas las celdas y dispararia el
         reajuste de todos los PTY sin ninguna razon. */
      .celda {
        position: relative;
        box-sizing: border-box;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 2px solid #2a2a2a;
        background: #0c0c0c;
      }

      .celda.enfocada {
        border-color: #3b78ff;
      }
    </style>
  </head>
  <body>
    <div id="cuadricula"></div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
